
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heart Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *{ margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000000; font-family:'Outfit',sans-serif; color:#fff; }
  #canvas-container{ position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:1; }
  canvas{ display:block; width:100%; height:100%; cursor:grab; }
  canvas.dragging{ cursor:grabbing; }

  #title{
    position:fixed; top:calc(22px + env(safe-area-inset-top,0px)); left:0; width:100%;
    text-align:center; z-index:5; pointer-events:none;
    font-weight:600; font-size:15px; letter-spacing:6px; text-transform:uppercase;
    color:rgba(255,255,255,0.55); text-shadow:0 0 18px rgba(255,120,180,0.5);
    opacity:0; transition:opacity 1.6s ease;
  }
  #title.show{ opacity:1; }
  #hint{
    position:fixed; bottom:calc(30px + env(safe-area-inset-bottom,0px)); left:0; width:100%;
    text-align:center; z-index:5; pointer-events:none;
    font-size:13px; font-weight:300; letter-spacing:1px; color:rgba(255,255,255,0.45);
    opacity:0; transition:opacity 1.2s ease;
  }
  #hint.show{ opacity:1; }
  #music-btn{
    position:fixed; z-index:20; right:calc(20px + env(safe-area-inset-right,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
    width:46px; height:46px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:rgba(20,10,25,0.55); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:20px;
    box-shadow:0 0 18px rgba(255,120,190,0.35);
    opacity:0; transition:opacity 1.6s ease, transform .2s ease;
  }
  #music-btn.show{ opacity:1; }
  #music-btn:hover{ transform:scale(1.08); }
  #music-btn.playing{ animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 14px rgba(255,120,190,0.35);} 50%{ box-shadow:0 0 28px rgba(255,120,190,0.8);} }
  .msg{
    position:fixed; z-index:10; pointer-events:none; left:0; top:0;
    transform:translate(-50%,-50%);
    font-weight:600; font-size:17px; white-space:nowrap;
    padding:9px 16px; border-radius:20px;
    background:rgba(20,10,25,0.55); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 0 25px rgba(255,120,190,0.35);
    opacity:0; transition:opacity .5s ease, transform 2.4s ease;
  }
  .msg.show{ opacity:1; transform:translate(-50%,-140px) scale(1.04); }
</style>
</head>
<body>
<div id="title">Heart Universe</div>
<div id="hint">✨ drag to explore · click a heart for its secret ✨</div>
<div id="canvas-container"></div>

<!-- Music: put your song next to this file and name it music.mp3 -->
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>
<button id="music-btn" aria-label="Toggle music" title="Music">🎵</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
  const REST_Z = 24;
  const INTRO_START_Z = 150;
  camera.position.set(0,0,INTRO_START_Z);

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000,1);
  container.appendChild(renderer.domElement);

  // ---- heart sprite texture ----
  function heartTexture(){
    const s=256, c=document.createElement('canvas'); c.width=c.height=s;
    const ctx=c.getContext('2d');
    ctx.translate(s/2, s/2+18);
    const scale = 6.6;
    ctx.beginPath();
    for(let t=0;t<=Math.PI*2+0.01;t+=0.04){
      const mx = 16*Math.pow(Math.sin(t),3);
      const my = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
      const px = mx*scale, py = -my*scale;
      if(t===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.save(); ctx.clip();
    // base body: soft falloff so overlap reads as color, not a white disc
    const base = ctx.createRadialGradient(0,-10,4,0,-10,105);
    base.addColorStop(0,'rgba(255,255,255,0.88)');
    base.addColorStop(0.55,'rgba(255,255,255,0.62)');
    base.addColorStop(1,'rgba(255,255,255,0.18)');
    ctx.fillStyle=base;
    ctx.fillRect(-130,-130,260,260);
    // glossy sheen highlight, upper-left
    const sheen = ctx.createRadialGradient(-30,-55,2,-30,-55,55);
    sheen.addColorStop(0,'rgba(255,255,255,0.95)');
    sheen.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sheen;
    ctx.fillRect(-130,-130,260,260);
    // soft shaded edge, lower-right, for roundness
    const shade = ctx.createRadialGradient(28,30,2,28,30,70);
    shade.addColorStop(0,'rgba(80,20,50,0.28)');
    shade.addColorStop(1,'rgba(80,20,50,0)');
    ctx.fillStyle=shade;
    ctx.fillRect(-130,-130,260,260);
    ctx.restore();
    // crisp thin edge so the heart silhouette reads cleanly at small sizes
    ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.stroke();
    return new THREE.CanvasTexture(c);
  }
  function starTexture(){
    const s=64,c=document.createElement('canvas'); c.width=c.height=s;
    const ctx=c.getContext('2d');
    const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s/2,s/2,s/2,0,7); ctx.fill();
    return new THREE.CanvasTexture(c);
  }

  function glowTexture(){
    const s=128,c=document.createElement('canvas'); c.width=c.height=s;
    const ctx=c.getContext('2d');
    const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,'rgba(255,255,255,0.55)');
    g.addColorStop(0.4,'rgba(255,255,255,0.22)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s/2,s/2,s/2,0,7); ctx.fill();
    return new THREE.CanvasTexture(c);
  }
  const heartTex = heartTexture();
  const starTex = starTexture();
  const glowTex = glowTexture();

  // ---- galaxy of hearts (built as size tiers, since PointsMaterial has one uniform size) ----
  const hueBands = [340,350,8, 210,225, 275,290]; // rose/red, sky blue, lilac
  function randomHeartColor(){
    const hue = hueBands[(Math.random()*hueBands.length)|0] + (Math.random()*8-4);
    const sat = 0.55 + Math.random()*0.4;
    const light = Math.random()<0.12 ? 0.9 : 0.6 + Math.random()*0.18;
    return new THREE.Color().setHSL(hue/360, sat, light);
  }
  const tilt = Math.PI/4.2;
  const vFOV = camera.fov*Math.PI/180;
  function placeHeart(){
    const z = Math.random()*20 - 12;               // spread across depth
    const dist = REST_Z - z;                        // fill the frame at resting distance, not intro distance
    const halfH = Math.tan(vFOV/2)*dist;
    const halfW = halfH*(innerWidth/innerHeight);
    const x = (Math.random()*2-1)*halfW*1.08;
    const y = (Math.random()*2-1)*halfH*1.08;
    return [x, y, z];
  }
  function buildTier(count, ptSize, opacity){
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count*3);
    const col = new Float32Array(count*3);
    for(let i=0;i<count;i++){
      const [x,y,z] = placeHeart();
      pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
      const c = randomHeartColor();
      col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color', new THREE.BufferAttribute(col,3));

    // soft halo behind the crisp heart, same positions/colors, bigger & dimmer
    const glowMat = new THREE.PointsMaterial({
      map:glowTex, size:ptSize*2.3, vertexColors:true, transparent:true,
      opacity:0, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true
    });
    glowMat.userData.base = opacity*0.5;
    const glowPts = new THREE.Points(geo, glowMat);

    const mat = new THREE.PointsMaterial({
      map:heartTex, size:ptSize, vertexColors:true, transparent:true,
      opacity:0, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true
    });
    mat.userData.base = opacity;
    const pts = new THREE.Points(geo, mat);

    // per-heart ambient drift: unique phase/speed/amplitude so each wanders independently
    const basePos = pos.slice();
    const phase = new Float32Array(count);
    const speed = new Float32Array(count);
    const amp = new Float32Array(count);
    for(let i=0;i<count;i++){
      phase[i] = Math.random()*Math.PI*2;
      speed[i] = 0.1 + Math.random()*0.2;
      amp[i] = 0.3 + Math.random()*0.7;
    }
    return {pts, glowPts, pos, basePos, phase, speed, amp, count};
  }
  const tierLarge = buildTier(70, 3.2, 0.9);
  const tierMed = buildTier(200, 2.0, 0.85);
  const tierSmall = buildTier(500, 1.1, 0.75);
  const heartTiers = [tierLarge, tierMed, tierSmall];
  const heartGroup = new THREE.Group();
  heartTiers.forEach(t=>{ heartGroup.add(t.glowPts); heartGroup.add(t.pts); });
  scene.add(heartGroup);

  // ---- star dust ----
  const SN = 1200;
  const sGeo = new THREE.BufferGeometry();
  const sPos = new Float32Array(SN*3);
  for(let i=0;i<SN;i++){
    sPos[i*3]=(Math.random()-0.5)*46;
    sPos[i*3+1]=(Math.random()-0.5)*30;
    sPos[i*3+2]=(Math.random()-0.5)*20-4;
  }
  sGeo.setAttribute('position', new THREE.BufferAttribute(sPos,3));
  const starMat = new THREE.PointsMaterial({
    map:starTex, size:0.28, color:0xffffff, transparent:true,
    depthWrite:false, blending:THREE.AdditiveBlending, opacity:0
  });
  starMat.userData.base = 0.8;
  const stars = new THREE.Points(sGeo, starMat);
  scene.add(stars);

  // ---- drag rotation ----
  let rotX=0, rotY=0, targetRotX=0, targetRotY=0;
  let dragging=false, lastX=0, lastY=0;
  const dom = renderer.domElement;
  function down(x,y){ dragging=true; lastX=x; lastY=y; dom.classList.add('dragging'); }
  function move(x,y){
    if(!dragging) return;
    targetRotY += (x-lastX)*0.005;
    targetRotX += (y-lastY)*0.005;
    targetRotX = Math.max(-0.9,Math.min(0.9,targetRotX));
    lastX=x; lastY=y;
  }
  function up(){ dragging=false; dom.classList.remove('dragging'); }
  dom.addEventListener('mousedown', e=>down(e.clientX,e.clientY));
  addEventListener('mousemove', e=>move(e.clientX,e.clientY));
  addEventListener('mouseup', up);

  // ---- zoom (wheel + pinch) ----
  const ZMIN=11, ZMAX=58;
  let targetZoom = camera.position.z;
  addEventListener('wheel', e=>{
    e.preventDefault();
    targetZoom = Math.max(ZMIN, Math.min(ZMAX, targetZoom + e.deltaY*0.03));
  }, {passive:false});

  let pinchDist = null;
  function touchDist(t0,t1){ return Math.hypot(t0.clientX-t1.clientX, t0.clientY-t1.clientY); }
  dom.addEventListener('touchstart', e=>{
    if(e.touches.length===2){
      pinchDist = touchDist(e.touches[0], e.touches[1]);
      dragging=false;
    } else {
      const t=e.touches[0]; down(t.clientX,t.clientY);
    }
  },{passive:true});
  dom.addEventListener('touchmove', e=>{
    if(e.touches.length===2 && pinchDist!==null){
      const d = touchDist(e.touches[0], e.touches[1]);
      targetZoom = Math.max(ZMIN, Math.min(ZMAX, targetZoom - (d-pinchDist)*0.05));
      pinchDist = d;
    } else if(e.touches.length===1){
      const t=e.touches[0]; move(t.clientX,t.clientY);
    }
  },{passive:true});
  dom.addEventListener('touchend', e=>{
    if(e.touches.length<2) pinchDist=null;
    up();
  });

  // subtle mouse parallax
  let mx=0,my=0;
  addEventListener('mousemove', e=>{
    mx = (e.clientX/innerWidth-0.5); my=(e.clientY/innerHeight-0.5);
  });

  // ---- messages ----
  const messages = [
    "Yours Truly 💌","Always & Forever 💞","My True North ⭐","My Favorite Hello 👋",
    "Home Is You 🏡","Still Falling For You 🍂","One In A Million 🌙","My Softest Place 🤍",
    "Every Time, You 🔁","Simply Yours 🎀","My Best Decision 💫","My Person 🧷",
    "The Sweetest Yes 🍯","Made For Me 🧩","My Quiet Joy 🌷","Forever & Ever 💍",
    "My Favorite Song 🎶","Closer Than Close 🫶","My Whole Heart ❤️","Written In The Stars ✨",
    "My Safe Harbor ⚓","Endlessly Yours ♾️","My Kind Of Magic 🪄","The Best Part Of My Day ☀️",
    "My Little Secret 🤫","Chosen, Always 🌸","My Bright Star 🌟","My Golden Thread 🧵",
    "Thinking Of You 💭","Lucky To Have You 🍀"
  ];
  let bag = [];
  function nextMessage(){
    if(bag.length===0) bag = messages.slice().sort(()=>Math.random()-0.5);
    return bag.pop();
  }

  const raycaster = new THREE.Raycaster();
  raycaster.params.Points.threshold = 1.4;
  const mouseNDC = new THREE.Vector2();
  let downX=0, downY=0;

  function screenFromWorld(v){
    const p = v.clone().project(camera);
    return { x:(p.x*0.5+0.5)*innerWidth, y:(-p.y*0.5+0.5)*innerHeight };
  }

  function spawnMessage(worldPos){
    const s = screenFromWorld(worldPos);
    const el = document.createElement('div');
    el.className='msg';
    el.textContent = nextMessage();
    el.style.left = s.x+'px';
    el.style.top = s.y+'px';
    document.body.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('show'));
    setTimeout(()=>{ el.style.opacity='0'; }, 1900);
    setTimeout(()=>el.remove(), 2500);
  }

  function onClick(clientX, clientY){
    mouseNDC.x = (clientX/innerWidth)*2-1;
    mouseNDC.y = -(clientY/innerHeight)*2+1;
    raycaster.setFromCamera(mouseNDC, camera);
    raycaster.params.Points.threshold = Math.max(0.6, camera.position.length()*0.06);
    const hit = raycaster.intersectObjects(heartTiers.map(t=>t.pts));
    if(hit.length){
      const obj = hit[0].object;
      const idx = hit[0].index;
      const tier = heartTiers.find(t=>t.pts===obj);
      const v = new THREE.Vector3(tier.pos[idx*3],tier.pos[idx*3+1],tier.pos[idx*3+2]);
      v.applyMatrix4(obj.matrixWorld);
      spawnMessage(v);
    }
  }
  dom.addEventListener('mousedown', e=>{downX=e.clientX; downY=e.clientY;});
  dom.addEventListener('mouseup', e=>{
    if(Math.hypot(e.clientX-downX, e.clientY-downY) < 5) onClick(e.clientX, e.clientY);
  });
  dom.addEventListener('touchend', e=>{
    if(e.touches.length>0) return;
    const t = e.changedTouches[0];
    if(Math.hypot(t.clientX-downX, t.clientY-downY) < 8) onClick(t.clientX, t.clientY);
  });
  dom.addEventListener('touchstart', e=>{
    if(e.touches.length===1){ downX=e.touches[0].clientX; downY=e.touches[0].clientY; }
  },{passive:true});

  // ---- music (music.mp3) ----
  const bgm = document.getElementById('bgm');
  const musicBtn = document.getElementById('music-btn');
  const MUSIC_VOL = 0.6;
  let musicWanted = true;   // flips to false if the user pauses manually
  let fadeTimer = null;
  function fadeTo(target, ms){
    clearInterval(fadeTimer);
    const start = bgm.volume, steps = 20, dt = ms/steps; let i = 0;
    fadeTimer = setInterval(()=>{
      i++; bgm.volume = Math.max(0, Math.min(1, start + (target-start)*(i/steps)));
      if(i>=steps){ clearInterval(fadeTimer); if(target===0) bgm.pause(); }
    }, dt);
  }
  function playMusic(){
    bgm.volume = 0;
    const p = bgm.play();
    if(p && p.then){
      p.then(()=>{ fadeTo(MUSIC_VOL, 1800); musicBtn.classList.add('playing'); musicBtn.textContent='🎵'; })
       .catch(()=>{ /* blocked until a user gesture, or file missing */ });
    }
  }
  function pauseMusic(){ fadeTo(0, 600); musicBtn.classList.remove('playing'); musicBtn.textContent='🔇'; }
  musicBtn.addEventListener('click', e=>{
    e.stopPropagation();
    if(bgm.paused){ musicWanted = true; playMusic(); }
    else { musicWanted = false; pauseMusic(); }
  });
  ['pointerdown','keydown','touchstart','wheel'].forEach(evt=>{
    addEventListener(evt, function first(ev){
      if(ev.target===musicBtn) return;
      if(musicWanted && bgm.paused) playMusic();
      if(!bgm.paused) removeEventListener(evt, first);
    }, {passive:true});
  });
  playMusic(); // works immediately where autoplay is allowed
  bgm.addEventListener('error', ()=>{ musicBtn.title='Add music.mp3 next to this file'; });

  // ---- intro: get pulled into the hearts on load ----
  const INTRO_MS = 3200;
  const introStartTime = performance.now();
  let introDone = false;
  const allMats = [...heartTiers.flatMap(t=>[t.pts.material, t.glowPts.material]), starMat];
  function finishIntro(){
    introDone = true;
    targetZoom = REST_Z;
    document.getElementById('title').classList.add('show');
    musicBtn.classList.add('show');
    document.getElementById('hint').classList.add('show');
    setTimeout(()=>{ document.getElementById('hint').classList.remove('show'); }, 5000);
  }

  // ---- animate ----
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    rotX += (targetRotX-rotX)*0.06;
    rotY += (targetRotY-rotY)*0.06;

    if(!introDone){
      const p = Math.min(1, (performance.now()-introStartTime)/INTRO_MS);
      const eased = 1 - Math.pow(1-p, 3); // easeOutCubic — fast pull-in, gentle settle
      camera.position.z = INTRO_START_Z + (REST_Z-INTRO_START_Z)*eased;
      allMats.forEach(m=>{ m.opacity = m.userData.base*eased; });
      heartGroup.rotation.z = (1-eased)*0.5;
      if(p>=1) finishIntro();
    } else {
      camera.position.z += (targetZoom - camera.position.z)*0.08;
    }

    heartGroup.rotation.y = t*0.012 + Math.sin(t*0.06)*0.12 + rotY;
    heartGroup.rotation.x = Math.sin(t*0.045)*0.05 + rotX;
    stars.rotation.y = t*0.008 + rotY*0.5;
    stars.rotation.x = rotX*0.5;

    heartTiers.forEach(tier=>{
      const {pos, basePos, phase, speed, amp, count} = tier;
      for(let i=0;i<count;i++){
        const ph=phase[i], sp=speed[i], a=amp[i], i3=i*3;
        pos[i3]   = basePos[i3]   + Math.sin(t*sp + ph)*a;
        pos[i3+1] = basePos[i3+1] + Math.cos(t*sp*1.3 + ph*1.4)*a*0.8;
        pos[i3+2] = basePos[i3+2] + Math.sin(t*sp*0.8 + ph*0.6)*a*0.6;
      }
      tier.pts.geometry.attributes.position.needsUpdate = true;
    });

    camera.position.x += (mx*2 - camera.position.x)*0.02;
    camera.position.y += (-my*1.2 - camera.position.y)*0.02;
    camera.lookAt(0,0,0);

    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
